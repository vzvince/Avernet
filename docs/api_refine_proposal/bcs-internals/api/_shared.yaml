openapi: 3.1.0
info:
  title: BCN API - Shared Components
  version: "2026-07-07"
  description: >
    BCN OpenAPI shared components. This file defines the unified response
    envelope, common security schemes, common parameters, reusable schemas, and
    reusable error responses. It does not define paths.
paths: {}
components:
  securitySchemes:
    humanCookie:
      type: apiKey
      in: cookie
      name: IAM_TOKEN
      description: >
        Human identity extracted by agent-pass-user-sdk from the browser cookie.
        BCS maps the staff identity to `human_{staff_no}` for actor-level checks.
    oauthSessionCookie:
      type: apiKey
      in: cookie
      name: bcs_session
      description: OAuth session cookie used by BCS internal OAuth mode.
    agentBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: BCS bot runtime token
      description: >
        Bot/agent identity. BCS also accepts `X-BCS-Bot-Token` for current
        implementation compatibility.
    agentPassBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: AgentPass JWT
      description: AgentPass JWT mapped to a BCN bot/agent identity.
    agentStaticBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Agent static bearer token
      description: Static bearer token configured for a Provider Bot/agent callback.
    providerAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: Provider admin token
      description: Provider admin token bound to a provider id.
    serviceKey:
      type: apiKey
      in: header
      name: X-BCS-Service-Key
      description: Service invocation key bound to one or more groups.
    signedToken:
      type: apiKey
      in: query
      name: token
      description: Signed token used by invite, proposal, and manual registration flows.
    loopback:
      type: apiKey
      in: header
      name: X-Loopback-Only
      description: >
        Documentation marker for loopback-only internal APIs. The current implementation
        validates the request peer IP rather than this header.

  headers:
    XTraceId:
      description: Request trace id, echoed as `request_id` in the JSON body.
      schema: { type: string }

  parameters:
    BotUuidPath:
      name: bot_uuid
      in: path
      required: true
      schema: { type: string }
      description: BCN bot UUID. Current BCS route name may be `{id}`.
    ActorIdPath:
      name: actor_id
      in: path
      required: true
      schema: { type: string }
      description: Actor id, usually a bot UUID or `human_{staff_no}`.
    FriendRequestIdPath:
      name: request_id
      in: path
      required: true
      schema: { type: string }
      description: Friend request id.
    ProviderIdPath:
      name: provider_id
      in: path
      required: true
      schema: { type: string }
    ProviderBotRefPath:
      name: provider_bot_ref
      in: path
      required: true
      schema: { type: string }
    GroupIdPath:
      name: group_id
      in: path
      required: true
      schema: { type: string }
      description: BCN group id. Current BCS route name may be `{id}`.
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema: { type: string }
      description: BCN session id. Current BCS route name may be `{sid}`.
    InviteTokenPath:
      name: token
      in: path
      required: true
      schema: { type: string }
      description: Signed invite token.
    SecretNamePath:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Secret name.
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema: { type: string }
      description: Async run id.
    NodeIdPath:
      name: node_id
      in: path
      required: true
      schema: { type: string }
      description: State-machine node id.
    OAuthProviderPath:
      name: provider
      in: path
      required: true
      schema: { type: string }
      description: OAuth provider id.
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema: { type: string }
      description: User id.
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    LimitQuery:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  schemas:
    Envelope:
      type: object
      description: Unified BCN response envelope.
      required: [code, message, request_id]
      properties:
        code:
          type: integer
          description: 6-digit code. The first three digits match the HTTP status.
          examples: [200000, 404101]
        message:
          type: string
          description: Human-readable English message.
          examples: [OK, bot not found]
        data:
          nullable: true
          description: Response payload. Error responses always use null.
        request_id:
          type: string
          description: Request trace id, equal to response header `X-Trace-Id`.
      example: { code: 200000, message: OK, data: null, request_id: req-7f3a2c }

    EmptyDataResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data: { nullable: true }

    PageMeta:
      type: object
      required: [total, offset, limit]
      properties:
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }

    Skill:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
      example: { name: sql_analysis, description: Analyzes SQL }

    BotVisibility:
      type: string
      enum: [public, protected, private]

    ActorKind:
      type: string
      enum: [bot, human]

    ActorStatus:
      type: string
      enum: [online, hidden]

    ParticipantMode:
      type: string
      enum: [driver, coordinator, participant, observer]

    BotCapabilities:
      type: object
      required: [name]
      properties:
        name: { type: string }
        summary: { type: string, nullable: true }
        domains:
          type: array
          items: { type: string }
        skills:
          type: array
          description: Structured skill list. Legacy string-only skills should not be exposed in BCN OpenAPI.
          items: { $ref: "#/components/schemas/Skill" }
        scopes:
          type: array
          items: { type: string }
          example: [repo:read, logs:query, prod-db:readonly]
        visibility: { $ref: "#/components/schemas/BotVisibility" }
      example:
        name: Reviewer Bot
        summary: Reviews code and SQL changes
        domains: [code, sql]
        skills:
          - { name: code_review, description: Reviews code changes }
          - { name: sql_analysis, description: Analyzes SQL }
        scopes: [repo:read, logs:query]
        visibility: protected

    Bot:
      type: object
      required: [bot_uuid, capabilities]
      properties:
        bot_uuid: { type: string }
        capabilities: { $ref: "#/components/schemas/BotCapabilities" }
        created_by: { type: string, nullable: true }
        actor_kind: { $ref: "#/components/schemas/ActorKind" }
        status: { $ref: "#/components/schemas/ActorStatus" }
        dynamic_status:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [active, offline] }
        env: { type: string, nullable: true }

    Actor:
      type: object
      required: [actor_id, actor_kind]
      properties:
        actor_id: { type: string }
        actor_kind: { $ref: "#/components/schemas/ActorKind" }
        display_name: { type: string, nullable: true }
        bot_uuid: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ActorStatus" }

    Group:
      type: object
      required: [group_id]
      properties:
        group_id: { type: string }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/BotVisibility" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/Actor" }

    Session:
      type: object
      required: [session_id, group_id]
      properties:
        session_id: { type: string }
        group_id: { type: string }
        title: { type: string, nullable: true }
        status: { type: string, nullable: true }
        creator: { type: string, nullable: true }
        participants:
          type: array
          items: { $ref: "#/components/schemas/Actor" }

    Message:
      type: object
      required: [message_id, sender, content, created_at]
      properties:
        message_id: { type: string }
        sender: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }

    Provider:
      type: object
      required: [provider_id]
      properties:
        provider_id: { type: string }
        name: { type: string, nullable: true }
        enabled: { type: boolean, nullable: true }
        auth_mode: { type: string, nullable: true }

    ProviderBotBinding:
      type: object
      required: [bot_uuid, provider_id, provider_bot_ref]
      properties:
        bot_uuid: { type: string }
        provider_id: { type: string }
        provider_bot_ref: { type: string }
        bot_runtime_token: { type: string, nullable: true }
        capabilities: { $ref: "#/components/schemas/BotCapabilities" }

    InviteLink:
      type: object
      required: [url, token]
      properties:
        url: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

  responses:
    BadRequest:
      description: Invalid request.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 400000, message: invalid request, data: null, request_id: req-400a }
    Unauthorized:
      description: Authentication required.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 401000, message: authentication required, data: null, request_id: req-401a }
    Forbidden:
      description: Permission denied.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 403000, message: permission denied, data: null, request_id: req-403a }
    NotFound:
      description: Resource not found.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 404000, message: not found, data: null, request_id: req-404a }
    Conflict:
      description: Resource conflict.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 409000, message: resource conflict, data: null, request_id: req-409a }
    Gone:
      description: Resource expired or terminated.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 410000, message: resource gone, data: null, request_id: req-410a }
    TooManyRequests:
      description: Quota exceeded.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 429000, message: quota exceeded, data: null, request_id: req-429a }
    InternalError:
      description: Internal error.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 500000, message: internal error, data: null, request_id: req-500a }
    ServiceUnavailable:
      description: Service unavailable.
      headers: { X-Trace-Id: { $ref: "#/components/headers/XTraceId" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example: { code: 503000, message: service unavailable, data: null, request_id: req-503a }
